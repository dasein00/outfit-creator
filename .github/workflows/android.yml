name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk DASEIN.apk

      - name: Error summary
        if: failure()
        run: |
          grep -E "^e: |FAILED|AssertionError|What went wrong" -A4 build.log | head -150 || true
          find app/build/test-results -name "*.xml" -exec grep -l "<failure" {} \; 2>/dev/null | xargs -r grep -h -A6 "<failure" | head -60 || true

      - uses: actions/upload-artifact@v4
        with:
          name: DASEIN-apk
          path: android/DASEIN.apk

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: DASEIN 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: android/DASEIN.apk
          body: |
            Android-приложение DASEIN. Скачайте DASEIN.apk на телефон и установите.
            Обновление ставится поверх старой версии, данные сохраняются.

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: DASEIN-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/smoke.sh

      - name: Publish screenshots
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-screens
          name: Скриншоты автотеста
          prerelease: true
          make_latest: false
          files: shots/*
