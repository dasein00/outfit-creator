name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk Poryadok.apk

      - name: Error summary
        if: failure()
        run: |
          grep -E "^e: |FAILED|AssertionError|What went wrong" -A4 build.log | head -150 || true
          find app/build/test-results -name "*.xml" -exec grep -l "<failure" {} \; 2>/dev/null | xargs -r grep -h -A6 "<failure" | head -60 || true

      - uses: actions/upload-artifact@v4
        with:
          name: Poryadok-apk
          path: android/Poryadok.apk

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Порядок 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: android/Poryadok.apk
          body: |
            Android-приложение «Порядок». Скачайте Poryadok.apk на телефон и установите.
            Обновление ставится поверх старой версии, данные сохраняются.
